<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Moofin | IA conversacional para empresas ágiles</title>
  <meta name="description" content="Comprueba cómo responde la IA a situaciones reales de tu negocio. Agentes de IA para WhatsApp, catálogo, stock y citas en Venezuela y Latinoamérica.">
  <link rel="canonical" href="https://www.moofin.com.ve/">
  
  <!-- Open Graph -->
  <meta property="og:title" content="Moofin | IA conversacional para empresas ágiles">
  <meta property="og:description" content="Automatiza WhatsApp, catálogo y agendamiento de citas sin tareas repetitivas.">
  <meta property="og:url" content="https://www.moofin.com.ve/">
  <meta property="og:type" content="website">

  <!-- Schema JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Moofin",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "All",
    "description": "Sistema autónomo de inteligencia artificial para atención comercial, catálogo y agendamiento de citas por WhatsApp.",
    "areaServed": [
      { "@type": "Country", "name": "Venezuela" },
      { "@type": "Country", "name": "Latin America" }
    ],
    "offers": {
      "@type": "Offer",
      "price": "49.00",
      "priceCurrency": "USD"
    }
  }
  </script>

  <!-- Fuentes y CDN de Tailwind -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Estilos modulares externos -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="w-full">

  <!-- HERO SECTION -->
  <section class="hero-turquoise-glow pt-6 pb-16 px-4">
    <div class="ambient-aurora"></div>

    <!-- NAVBAR -->
    <header class="max-w-4xl mx-auto flex items-center justify-between relative z-10 mb-8 sm:mb-12">
      <a href="/" class="block transition-transform hover:scale-105 active:scale-95">
        <img 
          src="https://xclczvqoggvuuzaualbs.supabase.co/storage/v1/object/public/content-media/White-Moofin.png" 
          alt="Moofin" 
          class="h-16 sm:h-20 w-auto object-contain filter drop-shadow-sm"
        >
      </a>

      <a 
        href="https://wa.me/584240000000" 
        target="_blank"
        class="bg-[#021f1a] hover:bg-black text-white text-xs sm:text-sm font-extrabold px-6 py-3 rounded-full shadow-md transition-all active:scale-95 flex items-center gap-1.5"
      >
        <span>Ver Planes</span>
        <svg class="w-3.5 h-3.5 text-[#00e0ba]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </a>
    </header>

    <!-- CABECERA -->
    <div class="max-w-3xl mx-auto text-center relative z-10">
      <h1 class="hero-title text-3xl sm:text-5xl lg:text-6xl tracking-tight leading-[1.12] mb-6">
        IA conversacional para empresas ágiles
      </h1>

      <div class="w-full flex justify-center mb-5">
        <div class="pills-container inline-flex max-w-full overflow-x-auto no-scrollbar gap-1" id="pills-wrapper">
          <div id="tab-bubble"></div>
          <button class="pill-item active text-xs sm:text-sm" onclick="selectScenario('cita', this)">Agendar Cita</button>
          <button class="pill-item text-xs sm:text-sm" onclick="selectScenario('stock', this)">Consultar Stock</button>
          <button class="pill-item text-xs sm:text-sm" onclick="selectScenario('venta', this)">Cierre de Venta</button>
          <button class="pill-item text-xs sm:text-sm" onclick="selectScenario('info', this)">Horarios & Info</button>
        </div>
      </div>

      <p class="hero-subtitle text-sm sm:text-base max-w-md mx-auto mb-10 leading-relaxed">
        Comprueba cómo responde la IA a situaciones reales de tu negocio.
      </p>
    </div>

    <!-- MOCKUP DEL SMARTPHONE -->
    <div class="w-full max-w-[340px] sm:max-w-[360px] mx-auto relative z-20">
      <div class="phone-shadow rounded-[2.6rem] bg-[#111b21] p-2.5 border-4 border-white">
        <div class="rounded-[2.1rem] overflow-hidden bg-[#efeae2] flex flex-col h-[400px]">
          
          <div class="bg-[#075e54] px-4 py-3 flex items-center justify-between text-white shrink-0">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 rounded-full bg-[#00e0ba] text-[#003830] font-black text-xs flex items-center justify-center">
                M
              </div>
              <div class="text-left">
                <p class="text-xs font-bold leading-tight">Moofin Asistente</p>
                <p class="text-[10px] text-teal-200">en línea</p>
              </div>
            </div>
            <div class="flex items-center gap-2 text-white/80">
              <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 4V3z"/></svg>
            </div>
          </div>

          <div id="chat-box" class="p-3.5 space-y-2.5 overflow-y-auto flex-1 flex flex-col justify-start text-left text-xs leading-relaxed"></div>

          <div class="h-6 bg-[#efeae2] px-4 flex items-center shrink-0">
            <div id="typing-indicator" class="hidden text-slate-500 text-[10px] items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-[#075e54] animate-bounce"></span>
              <span class="w-1.5 h-1.5 rounded-full bg-[#075e54] animate-bounce [animation-delay:0.2s]"></span>
              <span class="w-1.5 h-1.5 rounded-full bg-[#075e54] animate-bounce [animation-delay:0.4s]"></span>
              <span class="ml-1 text-[10px] text-slate-600 font-medium">escribiendo...</span>
            </div>
          </div>

          <div class="bg-[#f0f2f5] px-3 py-2 flex items-center gap-2 border-t border-slate-200 shrink-0">
            <div class="flex-1 bg-white rounded-full px-3 py-1.5 text-slate-400 text-xs flex items-center justify-between border border-slate-200">
              <span>Mensaje...</span>
            </div>
            <div class="w-7 h-7 rounded-full bg-[#075e54] flex items-center justify-center text-white">
              <svg class="w-3 h-3 transform rotate-45 -ml-0.5" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"/></svg>
            </div>
          </div>

        </div>
      </div>

      <!-- BADGE Y CTA -->
      <div class="mt-6 text-center space-y-3">
        <p class="inline-flex items-center gap-1.5 text-xs font-bold text-[#053b32]">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
          <span>Implementación lista en 48 - 72 horas</span>
        </p>

        <div>
          <a 
            href="https://wa.me/584240000000" 
            target="_blank"
            class="inline-flex items-center justify-center w-full sm:w-auto bg-[#021f1a] hover:bg-black text-white px-8 py-3.5 rounded-full font-black text-sm shadow-lg transition-all active:scale-95"
          >
            Solicitar agente para mi negocio
          </a>
        </div>
      </div>

    </div>
  </section>

  <!-- Script modular externo -->
  <script src="js/main.js"></script>
</body>
</html>
