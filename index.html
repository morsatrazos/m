<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Moofin | IA conversacional para empresas ágiles</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    html, body {
      max-width: 100%;
      overflow-x: hidden !important;
      background-color: #ffffff;
      color: #04221e;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* Fondo degradado continuo: Turquesa Moofin a Blanco puro */
    .hero-turquoise-glow {
      position: relative;
      background: linear-gradient(
        180deg,
        #00e0ba 0%,
        #12e7c3 35%,
        #52f4dc 65%,
        #bbfbf1 85%,
        #ffffff 100%
      );
      width: 100%;
      overflow: hidden;
    }

    .ambient-aurora {
      position: absolute;
      top: -30%;
      left: 50%;
      transform: translateX(-50%);
      width: 140%;
      height: 600px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.45) 0%, rgba(0, 224, 186, 0) 70%);
      animation: auroraMove 9s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes auroraMove {
      0% { transform: translateX(-52%) scale(0.95); opacity: 0.6; }
      100% { transform: translateX(-48%) scale(1.05); opacity: 0.95; }
    }

    .title-white-glow {
      color: #ffffff;
      font-weight: 900;
      letter-spacing: -0.035em;
      filter: drop-shadow(0 0 24px rgba(0, 168, 138, 0.45));
    }

    /* CONTENEDOR DE PÍLDORAS CON CÁPSULA DESLIZANTE MORPH */
    .pills-container {
      position: relative;
      background: #ffffff;
      border-radius: 9999px;
      padding: 5px;
      display: inline-flex;
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 10px 28px -6px rgba(0, 140, 116, 0.22);
    }

    /* Cápsula interactiva flotante que viaja detrás de los botones */
    #tab-bubble {
      position: absolute;
      top: 5px;
      bottom: 5px;
      left: 5px;
      background: #00e0ba;
      border-radius: 9999px;
      transition: all 0.28s cubic-bezier(0.34, 1.3, 0.64, 1);
      z-index: 1;
      pointer-events: none;
    }

    .pill-item {
      position: relative;
      z-index: 2;
      transition: color 0.22s ease;
      white-space: nowrap;
      flex-shrink: 0;
      background: transparent;
      color: #025244;
      font-weight: 700;
      padding: 9px 20px;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
    }

    .pill-item:hover {
      color: #00332a;
    }

    .pill-item.active {
      color: #00332a;
      font-weight: 800;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .phone-shadow {
      box-shadow: 
        0 25px 60px -15px rgba(0, 140, 116, 0.28),
        0 10px 25px -10px rgba(0, 0, 0, 0.08);
    }
  </style>
</head>
<body class="w-full">

  <!-- ==================== SECCIÓN HERO TURQUESA CLARO ==================== -->
  <section class="hero-turquoise-glow pt-6 pb-16 px-4">
    <div class="ambient-aurora"></div>

    <!-- NAVBAR: LOGO NOTABLEMENTE MÁS GRANDE (h-16 sm:h-20) -->
    <header class="max-w-4xl mx-auto flex items-center justify-between relative z-10 mb-8 sm:mb-12">
      <a href="/" class="block transition-transform hover:scale-105 active:scale-95">
        <img 
          src="https://xclczvqoggvuuzaualbs.supabase.co/storage/v1/object/public/content-media/White-Moofin.png" 
          alt="Moofin" 
          class="h-16 sm:h-20 w-auto object-contain filter drop-shadow-sm"
        >
      </a>

      <a 
        href="https://wa.me/584240000000" 
        target="_blank"
        class="bg-white hover:bg-slate-50 text-[#008770] text-xs sm:text-sm font-extrabold px-6 py-3 rounded-full shadow-md transition-all active:scale-95 flex items-center gap-1.5"
      >
        <span>Ver Planes</span>
        <svg class="w-3.5 h-3.5 text-[#00e0ba]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </a>
    </header>

    <!-- CABECERA: TÍTULO BLANCO -> PÍLDORAS CON CÁPSULA FLOTANTE -> SUBTÍTULO -->
    <div class="max-w-3xl mx-auto text-center relative z-10">
      
      <h1 class="title-white-glow text-3xl sm:text-5xl lg:text-6xl tracking-tight leading-[1.12] mb-6">
        IA conversacional para empresas ágiles
      </h1>

      <!-- Contenedor con cápsula dinámica deslizante -->
      <div class="w-full flex justify-center mb-5">
        <div class="pills-container inline-flex max-w-full overflow-x-auto no-scrollbar gap-1" id="pills-wrapper">
          <!-- Burbuja que se desplaza y adapta su ancho orgánicamente -->
          <div id="tab-bubble"></div>

          <button class="pill-item active text-xs sm:text-sm" onclick="selectScenario('cita', this)">Agendar Cita</button>
          <button class="pill-item text-xs sm:text-sm" onclick="selectScenario('stock', this)">Consultar Stock</button>
          <button class="pill-item text-xs sm:text-sm" onclick="selectScenario('venta', this)">Cierre de Venta</button>
          <button class="pill-item text-xs sm:text-sm" onclick="selectScenario('info', this)">Horarios & Info</button>
        </div>
      </div>

      <p class="text-sm sm:text-base font-bold text-white max-w-md mx-auto mb-10 leading-relaxed drop-shadow-sm">
        Comprueba cómo responde la IA a situaciones reales de tu negocio.
      </p>

    </div>

    <!-- SIMULADOR SMARTPHONE SOBRE EL FUNDIDO BLANCO -->
    <div class="w-full max-w-[340px] sm:max-w-[360px] mx-auto relative z-20">
      <div class="phone-shadow rounded-[2.6rem] bg-[#111b21] p-2.5 border-4 border-white">
        
        <div class="rounded-[2.1rem] overflow-hidden bg-[#efeae2] flex flex-col h-[400px]">
          
          <!-- Barra superior WhatsApp -->
          <div class="bg-[#075e54] px-4 py-3 flex items-center justify-between text-white shrink-0">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 rounded-full bg-[#00e0ba] text-[#003830] font-black text-xs flex items-center justify-center">
                M
              </div>
              <div class="text-left">
                <p class="text-xs font-bold leading-tight">Moofin Asistente</p>
                <p class="text-[10px] text-teal-200">en línea</p>
              </div>
            </div>
            <div class="flex items-center gap-2 text-white/80">
              <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 4V3z"/></svg>
            </div>
          </div>

          <!-- Mensajes del chat -->
          <div id="chat-box" class="p-3.5 space-y-2.5 overflow-y-auto flex-1 flex flex-col justify-start text-left text-xs leading-relaxed"></div>

          <!-- Indicador de tipeo -->
          <div class="h-6 bg-[#efeae2] px-4 flex items-center shrink-0">
            <div id="typing-indicator" class="hidden text-slate-500 text-[10px] items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-[#075e54] animate-bounce"></span>
              <span class="w-1.5 h-1.5 rounded-full bg-[#075e54] animate-bounce [animation-delay:0.2s]"></span>
              <span class="w-1.5 h-1.5 rounded-full bg-[#075e54] animate-bounce [animation-delay:0.4s]"></span>
              <span class="ml-1 text-[10px] text-slate-600 font-medium">escribiendo...</span>
            </div>
          </div>

          <!-- Input inferior de WhatsApp -->
          <div class="bg-[#f0f2f5] px-3 py-2 flex items-center gap-2 border-t border-slate-200 shrink-0">
            <div class="flex-1 bg-white rounded-full px-3 py-1.5 text-slate-400 text-xs flex items-center justify-between border border-slate-200">
              <span>Mensaje...</span>
            </div>
            <div class="w-7 h-7 rounded-full bg-[#075e54] flex items-center justify-center text-white">
              <svg class="w-3 h-3 transform rotate-45 -ml-0.5" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"/></svg>
            </div>
          </div>

        </div>
      </div>

      <!-- BADGE Y CTA -->
      <div class="mt-6 text-center space-y-3">
        <p class="inline-flex items-center gap-1.5 text-xs font-bold text-[#006b58]">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
          <span>Implementación lista en 48 - 72 horas</span>
        </p>

        <div>
          <a 
            href="https://wa.me/584240000000" 
            target="_blank"
            class="inline-flex items-center justify-center w-full sm:w-auto bg-[#008770] hover:bg-[#00705d] text-white px-8 py-3.5 rounded-full font-black text-sm shadow-lg transition-all active:scale-95"
          >
            Solicitar agente para mi negocio
          </a>
        </div>
      </div>

    </div>
  </section>

  <!-- LÓGICA DE INTERACCIÓN -->
  <script>
    const scenarios = {
      cita: [
        { sender: 'user', text: 'Buenas tardes, quisiera saber si tienen turno disponible para consulta odontológica esta semana.' },
        { sender: 'bot', text: '¡Buenas tardes! Sí, tenemos disponibilidad con el especialista el jueves a las 3:30 PM o el viernes a las 10:00 AM. ¿Cuál le conviene mejor?' },
        { sender: 'user', text: 'El jueves a las 3:30 PM me queda excelente.' },
        { sender: 'bot', text: 'Perfecto. Por favor indíqueme su Nombre completo y cédula para formalizar la reserva.' },
        { sender: 'user', text: 'Carlos Mendoza, C.I. 18.452.120.' },
        { sender: 'bot', text: '¡Listo, Carlos! Su cita quedó agendada para el Jueves a las 3:30 PM.' },
        { sender: 'user', text: 'Okay, muchísimas gracias.' },
        { sender: 'bot', text: '¡A usted! Estamos a la orden, que tenga un excelente día.' }
      ],
      stock: [
        { sender: 'user', text: 'Hola, ¿tienen disponible el calzado deportivo Runner Pro en talla 41?' },
        { sender: 'bot', text: '¡Hola! Nos quedan 2 pares en talla 41 en color negro y 1 par en blanco. Su precio es de $45.' },
        { sender: 'user', text: '¿Hacen entregas hoy mismo?' },
        { sender: 'bot', text: 'Sí, contamos con delivery express para entrega el mismo día si confirma antes de las 4:00 PM.' },
        { sender: 'user', text: 'Perfecto, me quedo con el par en color negro.' },
        { sender: 'bot', text: '¡Excelente elección! Ya le transfiero con el área de despacho.' },
        { sender: 'user', text: 'Listo, gracias por la rapidez.' },
        { sender: 'bot', text: '¡Con todo gusto! Para servirle.' }
      ],
      venta: [
        { sender: 'user', text: 'Hola, me interesa implementar el sistema de IA en mi clínica, ¿cómo se cobra?' },
        { sender: 'bot', text: '¡Hola! Para clínicas recomendamos el Plan Pro de $149/mes con sincronización de citas. ¿Desea una demo guiada de 10 minutos?' },
        { sender: 'user', text: 'Sí, me gustaría que me contacten hoy mismo.' },
        { sender: 'bot', text: 'Entendido. Ya notificamos a nuestro equipo comercial para coordinar.' },
        { sender: 'user', text: 'Excelente, muchas gracias.' },
        { sender: 'bot', text: '¡Estamos para servirle! En breve le contactamos.' }
      ],
      info: [
        { sender: 'user', text: 'Hola, ¿dónde están ubicados y cuál es el horario de atención?' },
        { sender: 'bot', text: '¡Hola! Estamos en el CC Servimás, Nivel 1. De lunes a sábado de 8:30 AM a 6:00 PM corrido.' },
        { sender: 'user', text: '¿Aceptan pagos por Pago Móvil a tasa oficial?' },
        { sender: 'bot', text: 'Sí, aceptamos Pago Móvil a tasa oficial, divisas en efectivo y Zelle.' },
        { sender: 'user', text: 'Buenísimo, paso por allá en un rato.' },
        { sender: 'bot', text: '¡Será un placer recibirle! Le esperamos.' }
      ]
    };

    let currentTimeout = null;

    // Cálculo milimétrico de la cápsula flotante
    function updateBubble(targetBtn) {
      const bubble = document.getElementById('tab-bubble');
      if (!bubble || !targetBtn) return;
      bubble.style.width = `${targetBtn.offsetWidth}px`;
      bubble.style.left = `${targetBtn.offsetLeft}px`;
    }

    function renderScenario(key) {
      if (currentTimeout) clearTimeout(currentTimeout);
      const chatBox = document.getElementById('chat-box');
      const typingIndicator = document.getElementById('typing-indicator');
      chatBox.innerHTML = '';
      
      const messages = scenarios[key];
      let index = 0;

      function step() {
        if (index >= messages.length) return;
        const msg = messages[index];

        if (msg.sender === 'bot') {
          typingIndicator.classList.remove('hidden');
          typingIndicator.classList.add('flex');
          currentTimeout = setTimeout(() => {
            typingIndicator.classList.add('hidden');
            typingIndicator.classList.remove('flex');
            appendMsg(msg);
            index++;
            currentTimeout = setTimeout(step, 2200);
          }, 1600);
        } else {
          appendMsg(msg);
          index++;
          currentTimeout = setTimeout(step, 1400);
        }
      }

      step();
    }

    function appendMsg(msg) {
      const chatBox = document.getElementById('chat-box');
      const div = document.createElement('div');
      
      if (msg.sender === 'user') {
        div.className = 'ml-auto bg-[#d9fdd3] text-slate-800 p-2.5 rounded-2xl rounded-tr-none max-w-[85%] shadow-sm text-xs border border-[#c4e8be]';
      } else {
        div.className = 'mr-auto bg-white text-slate-800 p-2.5 rounded-2xl rounded-tl-none max-w-[85%] shadow-sm text-xs border border-slate-200';
      }
      div.innerText = msg.text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function selectScenario(key, btn) {
      document.querySelectorAll('.pill-item').forEach(b => {
        b.classList.remove('active');
      });
      btn.classList.add('active');
      updateBubble(btn);
      renderScenario(key);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const activeBtn = document.querySelector('.pill-item.active');
      updateBubble(activeBtn);
      renderScenario('cita');
    });

    window.addEventListener('resize', () => {
      const activeBtn = document.querySelector('.pill-item.active');
      updateBubble(activeBtn);
    });
  </script>
</body>
</html>
